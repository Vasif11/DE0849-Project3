# OCUDU gNB (26.04.0) - 5G SA cell with ZeroMQ radio emulation and a DU-side E2 agent.
# Preserves the Project 2 N2/N3 interfaces (AMF 10.20.2.12, UPF 10.20.3.14) and connects to FlexRIC.
cu_cp:
  amf:
    addr: 10.20.2.12            # Open5GS AMF (N2, NGAP/SCTP 38412)
    port: 38412
    bind_addr: 10.20.2.11       # gNB N2 address
    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1

cu_up:
  ngu:
    socket:
      - bind_addr: 10.20.3.11   # gNB N3 address (GTP-U towards UPF 10.20.3.14)

ru_sdr:
  device_driver: zmq
  # DL: gNB tx_port is read by the UE rx_port; UL: UE tx_port is read by the gNB rx_port
  device_args: tx_port=tcp://10.20.11.10:2000,rx_port=tcp://10.20.11.20:2001,base_srate=11.52e6
  srate: 11.52
  tx_gain: 75
  rx_gain: 75

cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 10
  common_scs: 15
  plmn: "00101"
  tac: 1
  pci: 1

# E2 agent on the DU: E2 setup towards FlexRIC (SCTP 36421), KPM and RC service models enabled
e2:
  enable_du_e2: true
  addr: 10.20.11.30
  port: 36421
  bind_addr: 10.20.11.10
  e2sm_kpm_enabled: true
  e2sm_rc_enabled: true

# measurement layers needed by the KPM service model; 1000 ms DU reporting period
metrics:
  layers:
    enable_sched: true
    enable_rlc: true
  periodicity:
    du_report_period: 1000

log:
  filename: /tmp/gnb.log
  all_level: warning
  e2ap_level: info
