# Phase 6 - reference KPM monitoring xApp (FlexRIC example xapp_oran_moni)
# E2SM-KPM v3, 1000 ms reporting interval, KPM Indication Message Format 1,
# RAN type ngran_gNB_DU, measurements DRB.UEThpDl and DRB.UEThpUl.
SM_DIR = "/usr/local/lib/flexric/"

# supported name = NearRT_RIC, E2_Agent, E2_Proxy_Agent, xApp
Name = "xApp"
NearRT_RIC_IP = "10.20.11.30"
E42_Port = 36422

Sub_ORAN_SM_List = (
    { name = "KPM", time = 1000,
      format = 1,
      ran_type = "ngran_gNB_DU",
      actions = (
            { name = "DRB.UEThpDl" },
            { name = "DRB.UEThpUl" }
            )
    }
)

xApp_DB = {
    enable = "OFF"
    ip = "127.0.0.1"
    dir = "/tmp/"
    filename = "testdb"
    username = "xapp"
    password = "unused"
}
