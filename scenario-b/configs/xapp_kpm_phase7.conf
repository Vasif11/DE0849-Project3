# Phase 7 - extended KPM subscription: the original throughput measurements are retained for
# comparison and DRB.RlcSduDelayDl, RRU.PrbTotDl, RRU.PrbTotUl are added (same 1000 ms, Format 1).
# The order of "actions" is the order of the returned measurement values (see README).
SM_DIR = "/usr/local/lib/flexric/"

Name = "xApp"
NearRT_RIC_IP = "10.20.11.30"
E42_Port = 36422

Sub_ORAN_SM_List = (
    { name = "KPM", time = 1000,
      format = 1,
      ran_type = "ngran_gNB_DU",
      actions = (
            { name = "DRB.UEThpDl" },
            { name = "DRB.UEThpUl" },
            { name = "RRU.PrbTotDl" },
            { name = "RRU.PrbTotUl" },
            { name = "DRB.RlcSduDelayDl" }
            )
    }
)

xApp_DB = {
    enable = "OFF"
    ip = "127.0.0.1"
    dir = "/tmp/"
    filename = "testdb"
    username = "xapp"
    password = "unused"
}
